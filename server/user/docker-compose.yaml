version: "3.8"

services:
  app:
    build:
      context: ./
      dockerfile: docker/php/DockerFile
    container_name: barberShop-server-user-laravel
    restart: always
    tty: true
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./:/var/www
    environment:
      - COMPOSER_HOME=/composer
      - COMPOSER_ALLOW_SUPERUSER=1
      - APP_ENV=${APP_ENV}
      - APP_KEY=${APP_KEY}
    depends_on:
      - db
      - redis
      - rabbitmq
    networks:
      - barberShop-server-user-network

  nginx:
    image: nginx:latest
    container_name: barberShop-server-user-nginx
    restart: always
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./:/var/www
      - ./docker/nginx:/etc/nginx/conf.d
    networks:
      - barberShop-server-user-network

  redis:
    build:
      context: ./
      dockerfile: docker/redis/DockerFile
    container_name: barberShop-server-user-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis:/data
    networks:
      - barberShop-server-user-network

  db:
    build:
      context: ./
      dockerfile: docker/db/DockerFile
    container_name: barberShop-server-user-db
    restart: always
    environment:
      - POSTGRES_DB=${DB_DATABASE}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db:/var/lib/postgresql/data
    networks:
      - barberShop-server-user-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: barberShop-server-user-rabbitmq
    restart: always
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - "./data:/var/lib/rabbitmq/mnesia/"
    networks:
      - barberShop-server-user-network
      - rabbitmq-network

networks:
  barberShop-server-user-network:
    driver: bridge

  rabbitmq-network:
    external: true

volumes:
  redis:
  db:
